<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="settings-card">
    <h2 class="sr-only">Settings form with profile, notification, privacy, and password options</h2>

    <!-- Profile Setting -->
    <div class="section">
      <p class="section-title">Profile Setting</p>
      <div class="section-body">

        <div class="form-group">
          <label>Profile picture</label>
          <div class="avatar-row">
            <img id="avatarPreview" class="avatar-preview" src="https://via.placeholder.com/64x64.png?text=%20" alt="Profile picture preview">
            <input type="file" id="profilePicture" accept="image/*">
          </div>
        </div>

        <div class="form-group">
          <label for="displayName">Name <span class="required">*</span></label>
          <input type="text" id="displayName" placeholder="Jane Doe">
        </div>

        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <input type="email" id="email" placeholder="jane@company.com">
        </div>

        <div class="form-group">
          <label for="language">Language</label>
          <select id="language">
            <option>English</option>
            <option>Spanish</option>
            <option>French</option>
            <option>German</option>
            <option>Portuguese</option>
            <option>Italian</option>
            <option>Chinese</option>
            <option>Japanese</option>
            <option>Korean</option>
            <option>Arabic</option>
            <option>Hindi</option>
            <option>Urdu</option>
            <option>Russian</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Password -->
    <div class="section bordered">
      <p class="section-title">Password</p>
      <div class="section-body">
        <div class="form-group">
          <label for="currentPassword">Current Password</label>
          <input type="password" id="currentPassword" placeholder="Enter current password">
        </div>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" placeholder="Enter new password">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter new password">
        </div>
      </div>
    </div>

    <!-- Notifications -->
    <div class="section bordered">
      <p class="section-title">Notifications</p>
      <div class="section-body">
        <label class="toggle-row">
          Email notifications
          <input type="checkbox" id="emailNotif" checked>
        </label>
        <label class="toggle-row">
          Push notifications
          <input type="checkbox" id="pushNotif">
        </label>
        <label class="toggle-row">
          Weekly digest
          <input type="checkbox" id="weeklyDigest" checked>
        </label>
      </div>
    </div>

    <!-- Privacy -->
    <div class="section bordered">
      <p class="section-title">Privacy</p>
      <div class="section-body">
        <label class="toggle-row">
          Make profile public
          <input type="checkbox" id="publicProfile">
        </label>
        <label class="toggle-row">
          Show activity status
          <input type="checkbox" id="activityStatus" checked>
        </label>
        <label class="toggle-row">
          Allow search engines to index my profile
          <input type="checkbox" id="searchIndexing">
        </label>
        <label class="toggle-row">
          Allow others to see my email
          <input type="checkbox" id="showEmail">
        </label>
        <label class="toggle-row">
          Share usage data to improve product
          <input type="checkbox" id="shareData" checked>
        </label>
        <label class="toggle-row">
          Two-factor authentication
          <input type="checkbox" id="twoFactor">
        </label>
      </div>
    </div>

    <div class="button-row">
      <button type="button" id="saveBtn" class="btn-primary">Save settings</button>
      <button type="button" id="resetBtn" class="btn-primary">Reset</button>
    </div>
  </div>

  <!-- Popup message -->
  <div id="popupOverlay" class="popup-overlay">
    <div class="popup-box">
      <p id="popupMessage"></p>
      <button type="button" id="popupClose" class="btn-primary">OK</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
